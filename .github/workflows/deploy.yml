name: Deploy hello

on:
  workflow_dispatch:   # manual for now, so it doesn't race the Cloud Build trigger

permissions:
  contents: read
  id-token: write      # lets the job request a GitHub OIDC token

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/855983648277/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: cloudbuild-deployer@local-public-510420.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - run: |
          IMAGE=us-central1-docker.pkg.dev/local-public-510420/apps/hello:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          gcloud run deploy hello-svc \
            --image="$IMAGE" --region=us-central1 \
            --service-account=hello-runtime@local-public-510420.iam.gserviceaccount.com