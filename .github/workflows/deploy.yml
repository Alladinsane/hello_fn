name: Deploy hello

on:
  workflow_dispatch:   # manual for now, so it doesn't race the Cloud Build trigger

permissions:
  contents: read
  id-token: write      # lets the job request a GitHub OIDC token

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/855983648277/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: cloudbuild-deployer@local-public-510420.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - run: |
          gcloud functions deploy hello \
            --gen2 --runtime=nodejs22 --region=us-central1 \
            --source=. --entry-point=hello --trigger-http \
            --service-account=hello-runtime@local-public-510420.iam.gserviceaccount.com \
            --build-service-account=projects/local-public-510420/serviceAccounts/fn-builder@local-public-510420.iam.gserviceaccount.com